name: Wallet Tracker

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so it can save its memory + dashboard data back to the repo

concurrency:
  group: wallet-tracker-single-run
  cancel-in-progress: false   # if two runs overlap, queue the second instead of racing

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save memory + dashboard data back to the repo
        run: |
          git config user.name "wallet-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in wallets.json seen_signatures.json telegram_offset.json scanner_seen.json alerts_log.json wallet_stats.json signal_outcomes.json recent_buys.json docs/data.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "update tracker state"
            git pull --rebase origin main
            git push
          fi
